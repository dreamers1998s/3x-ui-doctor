name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - name: Test
        run: go test ./...
      - name: Build Linux binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/3x-ui-doctor/3x-ui-doctor/internal/version.Version=${VERSION}" \
              -o "dist/xui-doctor-linux-${arch}" ./cmd/xui-doctor
          done
          (cd dist && sha256sum xui-doctor-linux-* > SHA256SUMS)
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/3x-ui-doctor.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
