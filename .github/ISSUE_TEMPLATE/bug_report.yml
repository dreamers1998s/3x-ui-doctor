name: Bug report
description: Report a reproducible Doctor defect without including secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste API tokens, cookies, subscription bodies, UUIDs, or private keys.
  - type: input
    id: doctor-version
    attributes:
      label: Doctor version
    validations:
      required: true
  - type: input
    id: panel-version
    attributes:
      label: 3x-ui version
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Redacted Markdown report
      description: Attach output generated by Doctor after checking it contains no opted-in network identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
